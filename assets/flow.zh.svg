<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 720" role="img" aria-labelledby="title desc">
  <title id="title">DeepSee 如何结合视觉与模型路由</title>
  <desc id="desc">图片由 Gemini Vision 读取并转换为证据，DeepSeek 负责写代码，再由 Flash、Pro、Auto 或 Customize 执行。</desc>
