    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#62B8FF"/><stop offset="1" stop-color="#72E6FF"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1800" height="720" rx="42" fill="#07090D"/>
